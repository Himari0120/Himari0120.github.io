// ===================================
// 共通処理
// ===================================

function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}

function normalizeName(value){
 return String(value||"")
  .normalize("NFKC")
  .trim()
  .replace(/\s+/g,"")
  .toLowerCase();
}

// ===================================
// URL重複チェック・強化版
// ===================================

function normalizeUrl(value){
 const raw=String(value||"").trim();

 if(!raw)return "";

 try{
  const u=new URL(raw);

  // URLとして正しくないものは比較対象にしない
  if(!["http:","https:"].includes(u.protocol))return "";

  // wwwの有無を統一
  const host=u.hostname.toLowerCase().replace(/^www\./,"");

  // URL末尾のスラッシュを統一
  let path=u.pathname.replace(/\/+$/,"").toLowerCase();

  // URLのハッシュは比較対象外
  u.hash="";

  // Amazonの商品URLはASINを基準に比較する
  const amazonHost=
   /(^|\.)amazon\.(co\.jp|com|co\.uk|de|fr|it|es|ca|com\.au|in|com\.br)$/i.test(host);

  if(amazonHost){
   const asinMatch=
    u.pathname.match(/\/(?:dp|gp\/product|gp\/aw\/d)\/([a-z0-9]{10})/i);

   if(asinMatch){
    return host+"/dp/"+asinMatch[1].toUpperCase();
   }
  }

  // 広告・計測用パラメータは除外
  const ignoredParams=new Set([
   "tag",
   "ref",
   "linkcode",
   "camp",
   "creative",
   "ascsubtag",
   "asc_source",
   "asc_campaign",
   "pd_rd_w",
   "pd_rd_wg",
   "pd_rd_r",
   "pf_rd_p",
   "pf_rd_r",
   "qid",
   "sr",
   "sprefix"
  ]);

  const keptParams=[];

  for(const [key,val] of u.searchParams.entries()){
   const lowerKey=key.toLowerCase();

   if(ignoredParams.has(lowerKey))continue;
   if(lowerKey.startsWith("utm_"))continue;

   keptParams.push([lowerKey,val]);
  }

  // パラメータの順番による違いをなくす
  keptParams.sort((a,b)=>{
   const keyCompare=a[0].localeCompare(b[0]);
   if(keyCompare!==0)return keyCompare;
   return a[1].localeCompare(b[1]);
  });

  const query=keptParams.map(([key,val])=>
   encodeURIComponent(key)+"="+encodeURIComponent(val)
  ).join("&");

  return host+path+(query?"?"+query:"");

 }catch(error){
  return "";
 }
}

// 商品に登録されているURLを取得
function getProductUrl(product){
 return String(product.url||product.link||"").trim();
}

// 商品名またはURLが重複している商品を探す
function findDuplicates(name,url){
 const normalizedName=normalizeName(name);
 const normalizedUrl=normalizeUrl(url);

 if(!normalizedName&&!normalizedUrl)return [];

 return products.filter(p=>{
  // 編集中の商品自身は除外
  if(editingProductId&&p._docId===editingProductId){
   return false;
  }

  const registeredName=normalizeName(p.name);
  const registeredUrl=normalizeUrl(getProductUrl(p));

  const sameName=
   normalizedName!==""&&
   registeredName!==""&&
   normalizedName===registeredName;

  const sameUrl=
   normalizedUrl!==""&&
   registeredUrl!==""&&
   normalizedUrl===registeredUrl;

  return sameName||sameUrl;
 });
}

// 重複内容を画面に表示
function showDuplicateNotice(){
 const name=$("name").value;
 const url=$("url").value;
 const duplicates=findDuplicates(name,url);

 if(!duplicates.length){
  duplicateNotice.style.display="none";
  duplicateNotice.innerHTML="";
  return;
 }

 duplicateNotice.style.display="block";

 duplicateNotice.innerHTML=
  "<strong>⚠️ 登録済みの商品が見つかりました</strong>"+
  "次の商品がすでに登録されています。"+
  duplicates.map(p=>{
   const sameName=
    normalizeName(name)===normalizeName(p.name);

   const sameUrl=
    normalizeUrl(url)!==""&&
    normalizeUrl(url)===normalizeUrl(getProductUrl(p));

   let reason=[];

   if(sameName)reason.push("商品名が一致");
   if(sameUrl)reason.push("商品URLが一致");

   return '<div class="duplicate-item">'+
    "<strong>"+esc(p.name)+"</strong><br>"+
    esc(getCategoryText(p))+"<br>"+
    '<span>検出理由：'+esc(reason.join("・"))+"</span>"+
    "</div>";
  }).join("")+
  '<div class="duplicate-help">同じ商品を登録しないよう確認してください。内容を確認したうえで保存できます。</div>';
}

// ===================================
// Cloudinary画像アップロード
// ===================================

async function uploadImage(file){
 const data=new FormData();

 data.append("file",file);
 data.append("upload_preset",UPLOAD_PRESET);

 const response=await fetch(
  `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
  {method:"POST",body:data}
 );

 const result=await response.json();

 if(!response.ok){
  throw new Error(result.error?.message||"画像のアップロードに失敗しました。");
 }

 return result.secure_url;
}

// ===================================
// Cloudinary画像削除
// ===================================

async function deleteCloudinaryImage(url){
 if(!url)return true;

 if(!currentUser){
  throw new Error("管理者ログインを確認できません。");
 }

 const idToken=await currentUser.getIdToken();

 const response=await fetch(WORKER_URL,{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
   idToken:idToken,
   imageUrl:url
  })
 });

 let result;

 try{
  result=await response.json();
 }catch(error){
  throw new Error("Workerから正しい応答がありません。");
 }

 if(!response.ok||!result.success){
  throw new Error(result.message||"Cloudinary画像の削除に失敗しました。");
 }

 return true;
}

// ===================================
// 画像選択
// ===================================

imageFile.addEventListener("change",async()=>{
 const file=imageFile.files[0];

 if(!file)return;

 if(!file.type.startsWith("image/")){
  alert("画像ファイルを選択してください。");
  imageFile.value="";
  return;
 }

 if(file.size>10*1024*1024){
  alert("画像は10MB以下のものを選んでください。");
  imageFile.value="";
  return;
 }

 uploading=true;
 addButton.disabled=true;
 imageStatus.textContent="Cloudinaryに画像をアップロードしています...";

 try{
  const uploadedUrl=await uploadImage(file);

  imageUrl=uploadedUrl;
  preview.src=uploadedUrl;
  preview.style.display="block";
  imageStatus.textContent="画像のアップロードが完了しました。";

 }catch(error){
  imageStatus.textContent="アップロードエラー："+error.message;
  imageFile.value="";

 }finally{
  uploading=false;
  addButton.disabled=false;
 }
});

  products=snapshot.docs.map(d=>({

 }
}

   '<button class="delete">削除</button>';

  div.querySelector(".edit").addEventListener("click",()=>{
   startEdit(p);
  });

  div.querySelector(".delete").addEventListener("click",()=>{
   removeProduct(p);
  });

  list.appendChild(div);
 });
}

// ===================================
// 商品編集
// ===================================

function startEdit(p){
 editingProductId=p._docId;
 editingOldImageUrl=p.image||"";

 $("name").value=p.name||"";
 $("description").value=p.description||"";
 $("url").value=p.url||p.link||"";

 let main=
  p.mainCategory||
  legacyCategoryMap[p.category]||
  p.category||
  "";

 let sub=p.subCategory||"";
 let detail=p.detailCategory||"";

 if(!categoryData[main]){
  main="";
  sub="";
  detail="";
 }

 mainSelect.value=main;
 updateSubCategories(sub);

 if(!sub||!categoryData[main]?.[sub]){
  subSelect.value="";
  detail="";
  updateDetailCategories();
 }else{
  updateDetailCategories(detail);
 }

 if(!detail||!categoryData[main][sub].includes(detail)){
  detailSelect.value="";
 }

 imageUrl=p.image||"";
 imageFile.value="";

 if(imageUrl){
  preview.src=imageUrl;
  preview.style.display="block";
  imageStatus.textContent="現在の画像を使用します。変更する場合は写真を選択してください。";
 }else{
  preview.style.display="none";
  imageStatus.textContent="画像は登録されていません。";
 }

 $("formTitle").textContent="商品を編集";
 addButton.textContent="変更を保存する";
 cancelEdit.classList.remove("hidden");

 showDuplicateNotice();
 window.scrollTo({top:0,behavior:"smooth"});
}

// ===================================
// 入力フォーム初期化
// ===================================

function resetForm(){
 $("form").reset();

 editingProductId=null;
 editingOldImageUrl="";
 imageUrl="";
 imageFile.value="";

 preview.src="";
 preview.style.display="none";

 duplicateNotice.style.display="none";
 duplicateNotice.innerHTML="";

 mainSelect.value="";
 updateSubCategories();

 imageStatus.textContent="写真を選ぶとCloudinaryにアップロードします。画像なしでも登録できます。";

 $("formTitle").textContent="商品を追加";
 addButton.textContent="商品を追加する";

 cancelEdit.classList.add("hidden");
}

cancelEdit.addEventListener("click",resetForm);

// ===================================
// 商品削除
// ===================================

async function removeProduct(p){
 if(!currentUser||currentUser.email!==ADMIN_EMAIL){
  alert("管理者としてログインしてください。");
  return;
 }

 if(!confirm("「"+p.name+"」を削除しますか？"))return;

 try{
  await deleteDoc(doc(db,"products",p._docId));

  products=products.filter(item=>item._docId!==p._docId);

  draw();
  showDuplicateNotice();

  status.textContent="登録商品："+products.length+"件";

  if(p.image){
   try{
    await deleteCloudinaryImage(p.image);
    alert("商品とCloudinary画像を削除しました。");
   }catch(imageError){
    alert("商品データは削除しましたが、Cloudinary画像の削除に失敗しました。\n"+imageError.message);
   }
  }else{
   alert("商品を削除しました。");
  }

 }catch(error){
  alert("商品を削除できませんでした："+error.message);
 }
}

// ===================================
// 保存直前にFirestoreから最新データを取得
// ===================================

async function refreshProductsForDuplicateCheck(){
 const snapshot=await getDocs(collection(db,"products"));

 products=snapshot.docs.map(d=>({
  ...d.data(),
  _docId:d.id
 }));
}

// ===================================
// 商品登録・編集
// ===================================

$("form").addEventListener("submit",async e=>{
 e.preventDefault();

 if(saving)return;

 if(uploading){
  alert("画像のアップロードが終わるまでお待ちください。");
  return;
 }

 if(!currentUser||currentUser.email!==ADMIN_EMAIL||!currentUser.emailVerified){
  alert("管理者としてログインしてください。");
  return;
 }

 const name=$("name").value.trim();
 const url=$("url").value.trim();

 const main=mainSelect.value;
 const sub=subSelect.value;
 const detail=detailSelect.value;

 if(!name){
  alert("商品名を入力してください。");
  return;
 }

 if(!main||!sub||!detail){
  alert("大・中・小カテゴリーをすべて選択してください。");
  return;
 }

 if(!/^https:\/\//i.test(url)){
  alert("商品リンクはhttps://から入力してください。");
  return;
 }

 // URL形式を確認
 if(!normalizeUrl(url)){
  alert("商品リンクのURLを確認してください。");
  return;
 }

 saving=true;
 addButton.disabled=true;
 addButton.textContent="重複チェック中...";

 try{
  // 最新のFirestoreデータを取得して重複確認
  await refreshProductsForDuplicateCheck();

  const duplicates=findDuplicates(name,url);

  if(duplicates.length){
   const duplicateNames=duplicates.map(p=>{
    const sameName=
     normalizeName(name)===normalizeName(p.name);

    const sameUrl=
     normalizeUrl(url)!==""&&
     normalizeUrl(url)===normalizeUrl(getProductUrl(p));

    const reasons=[];
    if(sameName)reasons.push("商品名が一致");
    if(sameUrl)reasons.push("商品URLが一致");

    return "・"+p.name+
     "（"+getCategoryText(p)+"）"+
     "\n  "+reasons.join("・");
   }).join("\n\n");

   const proceed=confirm(
    "⚠️ 登録済みの商品が見つかりました。\n\n"+
    duplicateNames+
    "\n\n同じ商品を重複登録する可能性があります。\n"+
    "内容を確認してください。\n\n"+
    "登録を続ける場合は「OK」を押してください。"
   );

   if(!proceed){
    showDuplicateNotice();
    return;
   }
  }

  const isEditing=!!editingProductId;
  const productId=editingProductId;
  const oldImage=editingOldImageUrl;

  addButton.textContent="保存中...";

  const data={
   name:name,
   mainCategory:main,
   subCategory:sub,
   detailCategory:detail,
   category:main,
   description:$("description").value.trim(),
   image:imageUrl,
   url:url,
   link:url
  };

  if(isEditing){
   await updateDoc(doc(db,"products",productId),data);

   if(oldImage&&oldImage!==imageUrl){
    try{
     await deleteCloudinaryImage(oldImage);
     alert("商品を更新し、古い画像も削除しました。");
    }catch(imageError){
     alert("商品は更新しましたが、古い画像の削除に失敗しました。\n"+imageError.message);
    }
   }else{
    alert("商品を更新しました。");
   }

  }else{
   data.id=Date.now();
   await addDoc(collection(db,"products"),data);
   alert("商品を保存しました。");
  }

  resetForm();
  await loadProducts();

 }catch(error){
  console.error(error);
  alert("保存できませんでした："+error.message);

 }finally{
  saving=false;
  addButton.disabled=false;
  addButton.textContent=editingProductId
   ?"変更を保存する"
   :"商品を追加する";
 }
});
</script>
</body>
</html>
