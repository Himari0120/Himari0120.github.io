
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おトク発見ナビ｜商品管理</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#f7f5ff;color:#333;font-family:Arial,"Noto Sans JP",sans-serif}
main{max-width:750px;margin:30px auto;background:white;padding:25px;border-radius:20px;box-shadow:0 5px 25px #0000000d}
h1{color:#705bc7;font-size:24px}
.note{font-size:13px;color:#888;line-height:1.7}
button{border:0;border-radius:22px;padding:12px 18px;background:#7963d8;color:white;font-weight:bold;cursor:pointer;margin:5px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;margin:7px 0 15px;font-size:14px}
label{font-size:13px;font-weight:bold}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid #eee;border-radius:12px;margin:10px 0}
.item-name{font-size:13px;flex:1;overflow-wrap:anywhere}
.delete{background:#fff0f0;color:#c44}
.secondary{background:#eee;color:#555}
hr{border:0;border-top:1px solid #eee;margin:25px 0}
</style>
</head>
<body>
<main>
<h1>おトク発見ナビ 商品管理</h1>
<p class="note">商品を追加・削除して、商品データを更新できます。変更内容は書き出したproducts.jsをGitHubに反映すると公開サイトに反映されます。</p>

<h2>商品を追加</h2>
<form id="form">
<label>商品名 *</label>
<input id="name" required>
<label>カテゴリー *</label>
<select id="category">
<option>AI・便利ツール</option>
<option>パソコン・家電</option>
<option>美容・ファッション</option>
<option>生活・便利グッズ</option>
<option>旅行・ホテル</option>
</select>
<label>商品説明</label>
<textarea id="description"></textarea>
<label>商品リンク *</label>
<input id="url" type="url" required placeholder="https://...">
<label>商品画像URL</label>
<input id="image" type="url" placeholder="https://...">
<button type="submit">商品を追加する</button>
</form>

<hr>
<h2>登録済み商品</h2>
<div id="list">読み込み中...</div>

<hr>
<h2>商品データの保存</h2>
<button id="export">products.jsを書き出す</button>
<p class="note">書き出したファイルをGitHubのproducts.jsに上書きしてCommitしてください。</p>
</main>

<script src="products.js"></script>
<script>
let products=(window.PRODUCTS||[]).map(p=>({...p,link:p.link||p.url||""}));

function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}

function draw(){
 const list=document.getElementById("list");
 list.innerHTML="";
 if(!products.length){
  list.textContent="商品はありません。";
  return;
 }
 products.forEach((p,i)=>{
  const div=document.createElement("div");
  div.className="item";
  div.innerHTML='<div class="item-name">'+esc(p.name)+'<br><span style="color:#999">'+esc(p.category)+'</span></div><button class="delete">削除</button>';
  div.querySelector("button").addEventListener("click",()=>{
   if(!confirm("「"+p.name+"」を削除しますか？"))return;
   products.splice(i,1);
   draw();
  });
  list.appendChild(div);
 });
}

document.getElementById("form").addEventListener("submit",e=>{
 e.preventDefault();
 const url=document.getElementById("url").value.trim();
 const image=document.getElementById("image").value.trim();
 if(!/^https:\/\//i.test(url)){
  alert("商品リンクはhttps://から入力してください。");
  return;
 }
 if(image&&!/^https:\/\//i.test(image)){
  alert("画像URLはhttps://から入力してください。");
  return;
 }
 products.push({
  id:Date.now(),
  name:document.getElementById("name").value.trim(),
  category:document.getElementById("category").value,
  description:document.getElementById("description").value.trim(),
  image,
  url,
  link:url
 });
 e.target.reset();
 draw();
 alert("商品を追加しました。最後にproducts.jsを書き出してください。");
});

document.getElementById("export").addEventListener("click",()=>{
 const content="// おトク発見ナビ 商品管理データ\nwindow.PRODUCTS = "+
 JSON.stringify(products,null,2)+";\n";
 const blob=new Blob([content],{type:"text/javascript;charset=utf-8"});
 const objectURL=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=objectURL;
 a.download="products.js";
 a.click();
 setTimeout(()=>URL.revokeObjectURL(objectURL),1000);
});

draw();
</script>
</body>
</html>
