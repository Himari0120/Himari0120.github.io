
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おトク発見ナビ｜商品管理</title>

<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#f7f5ff;color:#333;font-family:Arial,"Noto Sans JP",sans-serif}
main{max-width:750px;margin:30px auto;background:white;padding:25px;border-radius:20px;box-shadow:0 5px 25px #0000000d}
h1{color:#705bc7;font-size:24px}
h2{font-size:19px}
.note{font-size:13px;color:#888;line-height:1.7}
button{border:0;border-radius:22px;padding:12px 18px;background:#7963d8;color:white;font-weight:bold;cursor:pointer;margin:5px}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;margin:7px 0 15px;font-size:14px;background:white}
label{font-size:13px;font-weight:bold}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px;border:1px solid #eee;border-radius:12px;margin:10px 0;flex-wrap:wrap}
.item-name{font-size:13px;flex:1;overflow-wrap:anywhere}
.delete{background:#fff0f0;color:#c44}
.secondary{background:#eee;color:#555}
.edit{background:#eee;color:#705bc7}
.back-button{display:inline-block;text-decoration:none;background:#f0ebff;color:#705bc7;padding:11px 18px;border-radius:22px;font-size:14px;font-weight:bold;margin-bottom:15px}
.hidden{display:none}
hr{border:0;border-top:1px solid #eee;margin:25px 0}
.status{font-size:13px;color:#705bc7;margin:10px 0}
#preview{display:none;max-width:100%;max-height:220px;object-fit:contain;border-radius:12px;margin:5px 0 15px;background:#f7f5ff;padding:5px}
.file-label{display:block;background:#f3efff;border:2px dashed #b8a8ed;border-radius:14px;padding:20px;text-align:center;color:#705bc7;cursor:pointer;margin:8px 0}
.file-label input{display:none}
.item-thumb{width:55px;height:55px;object-fit:cover;border-radius:8px;background:#f7f5ff}
.category-box{background:#faf8ff;border:1px solid #eee7fa;border-radius:14px;padding:15px;margin:8px 0 18px}
.category-box label{display:block;color:#705bc7;margin-top:5px}
.category-box select{margin-bottom:12px}
.category-box select:last-child{margin-bottom:0}
.category-help{font-size:12px;color:#999;line-height:1.6;margin:0 0 10px}
.category-tag{display:inline-block;background:#f2edff;color:#7055b9;padding:5px 9px;border-radius:15px;font-size:11px;margin-top:5px}
@media(max-width:600px){
 body{padding:10px}
 main{margin:15px auto;padding:18px}
 .item{align-items:flex-start}
 .item-name{min-width:55%}
}
</style>
</head>

<body>
<main>
<a class="back-button" href="index.html">← 公開ページに戻る</a>

<h1>おトク発見ナビ 商品管理</h1>
<p class="note">管理者専用ページです。Googleアカウントでログインしてください。</p>

<section id="loginArea">
<button id="login">Googleアカウントでログイン</button>
<p id="message" class="note"></p>
</section>

<section id="adminArea" class="hidden">
<p class="note">ログイン中：<span id="userEmail"></span></p>
<button id="logout" class="secondary">ログアウト</button>

<hr>

<h2 id="formTitle">商品を追加</h2>

<form id="form">
<label>商品名 *</label>
<input id="name" required>

<label>商品カテゴリー *</label>
<div class="category-box">
<p class="category-help">大カテゴリーを選ぶと、中カテゴリーと小カテゴリーが自動で切り替わります。</p>

<label for="mainCategory">① 大カテゴリー</label>
<select id="mainCategory" required>
<option value="">大カテゴリーを選択してください</option>
</select>

<label for="subCategory">② 中カテゴリー</label>
<select id="subCategory" required disabled>
<option value="">先に大カテゴリーを選択してください</option>
</select>

<label for="detailCategory">③ 小カテゴリー</label>
<select id="detailCategory" required disabled>
<option value="">先に中カテゴリーを選択してください</option>
</select>
</div>

<label>商品説明</label>
<textarea id="description"></textarea>

<label>商品リンク *</label>
<input id="url" type="url" required placeholder="https://...">

<label>商品画像（写真ファイル）</label>
<label class="file-label">
<span>📷 写真を選択する</span>
<input id="imageFile" type="file" accept="image/*">
</label>

<img id="preview" alt="画像プレビュー">
<p id="imageStatus" class="note">写真を選ぶとCloudinaryにアップロードします。画像なしでも登録できます。</p>

<button type="submit" id="addButton">商品を追加する</button>
<button type="button" id="cancelEdit" class="secondary hidden">編集をキャンセル</button>
</form>

<hr>

<h2>登録済み商品</h2>
<p id="status" class="status"></p>
<div id="list">読み込み中...</div>
</section>
</main>

let products=[];
let currentUser=null;
let imageUrl="";
let editingProductId=null;

let uploading=false;

// ===================================

// ===================================

const categoryData={

// 旧カテゴリーの商品を新カテゴリーに対応させる
const legacyCategoryMap={
 "AI・便利ツール":"💻 デジタル・AI",
 "パソコン・家電":"💻 デジタル・AI",
 "美容・ファッション":"💄 美容・ファッション",
 "生活・便利グッズ":"🏠 暮らし・生活雑貨",
 "旅行・ホテル":"✈️ 旅行・レジャー"
};

// ===================================
// カテゴリー選択の初期設定
// ===================================

function fillSelect(select,values,placeholder){
 select.innerHTML="";
 const first=document.createElement("option");
 first.value="";
 first.textContent=placeholder;
 select.appendChild(first);

 values.forEach(value=>{
  const option=document.createElement("option");
  option.value=value;
  option.textContent=value;
  select.appendChild(option);
 });
}

function initMainCategories(){
 fillSelect(
  mainSelect,
  Object.keys(categoryData),
  "大カテゴリーを選択してください"
 );
}

function updateSubCategories(selectedValue=""){
 const main=mainSelect.value;
 const subs=categoryData[main]
  ?Object.keys(categoryData[main])
  :[];

 fillSelect(
  subSelect,
  subs,
  main?"中カテゴリーを選択してください":"先に大カテゴリーを選択してください"
 );

 subSelect.disabled=!main;
 subSelect.value=selectedValue;

 updateDetailCategories();
}

function updateDetailCategories(selectedValue=""){
 const main=mainSelect.value;
 const sub=subSelect.value;

 const details=
  categoryData[main]&&categoryData[main][sub]
   ?categoryData[main][sub]
   :[];

 fillSelect(
  detailSelect,
  details,
  sub?"小カテゴリーを選択してください":"先に中カテゴリーを選択してください"
 );

 detailSelect.disabled=!sub;
 detailSelect.value=selectedValue;
}

mainSelect.addEventListener("change",()=>{
 updateSubCategories();
});

subSelect.addEventListener("change",()=>{
 updateDetailCategories();
});

initMainCategories();

// ===================================
// Googleログイン
// ===================================

$("login").addEventListener("click",async()=>{
 message.textContent="ログインしています...";
 try{
  await signInWithPopup(auth,provider);
 }catch(error){
  message.textContent="ログインできませんでした："+error.message;
 }
});

$("logout").addEventListener("click",async()=>{
 await signOut(auth);
});

onAuthStateChanged(auth,async user=>{
 loginArea.classList.remove("hidden");
 adminArea.classList.add("hidden");
 currentUser=null;

 if(!user){
  message.textContent="管理者アカウントでログインしてください。";
  return;
 }

 if(user.email!==ADMIN_EMAIL||!user.emailVerified){
  message.textContent="このアカウントには管理権限がありません。";
  await signOut(auth);
  return;
 }

 currentUser=user;
 message.textContent="";
 loginArea.classList.add("hidden");
 adminArea.classList.remove("hidden");
 $("userEmail").textContent=user.email;

 await loadProducts();
});

// ===================================
// Cloudinary画像アップロード
// ===================================

async function uploadImage(file){
 const data=new FormData();
 data.append("file",file);
 data.append("upload_preset",UPLOAD_PRESET);

 const response=await fetch(
  `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
  {method:"POST",body:data}
 );

 const result=await response.json();

 if(!response.ok){
  throw new Error(result.error?.message||"画像のアップロードに失敗しました。");
 }

 return result.secure_url;
}

// ===================================
// Cloudinary画像削除
// ===================================

async function deleteCloudinaryImage(url){
 if(!url)return true;

 if(!currentUser){
  throw new Error("管理者ログインを確認できません。");
 }

 const idToken=await currentUser.getIdToken();

 const response=await fetch(WORKER_URL,{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
   idToken:idToken,
   imageUrl:url
  })
 });

 let result;

 try{
  result=await response.json();
 }catch(error){
  throw new Error("Workerから正しい応答がありません。");
 }

 if(!response.ok||!result.success){
  throw new Error(result.message||"Cloudinary画像の削除に失敗しました。");
 }

 return true;
}

// ===================================
// 画像選択
// ===================================

imageFile.addEventListener("change",async()=>{
 const file=imageFile.files[0];
 if(!file)return;

 if(!file.type.startsWith("image/")){
  alert("画像ファイルを選択してください。");
  imageFile.value="";
  return;
 }

 if(file.size>10*1024*1024){
  alert("画像は10MB以下のものを選んでください。");
  imageFile.value="";
  return;
 }

 uploading=true;
 addButton.disabled=true;
 imageStatus.textContent="Cloudinaryに画像をアップロードしています...";

 try{
  const uploadedUrl=await uploadImage(file);
  imageUrl=uploadedUrl;
  preview.src=uploadedUrl;
  preview.style.display="block";
  imageStatus.textContent="画像のアップロードが完了しました。";
 }catch(error){
  imageStatus.textContent="アップロードエラー："+error.message;
  imageFile.value="";
 }finally{
  uploading=false;
  addButton.disabled=false;
 }
});

// ===================================
// 商品読み込み
// ===================================

async function loadProducts(){
 list.textContent="商品を読み込み中...";
 status.textContent="";

 try{
  const snapshot=await getDocs(collection(db,"products"));
  products=snapshot.docs.map(d=>({...d.data(),_docId:d.id}));
  draw();
  status.textContent="登録商品："+products.length+"件";
 }catch(error){
  list.textContent="読み込みエラー："+error.message;
 }
}

function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}

// ===================================
// 商品一覧表示
// ===================================

function getCategoryText(p){
 const main=p.mainCategory||legacyCategoryMap[p.category]||p.category||"未分類";
 return [
  main,
  p.subCategory||"",
  p.detailCategory||""
 ].filter(Boolean).join(" ＞ ");
}

function draw(){
 list.innerHTML="";

 if(!products.length){
  list.textContent="商品はありません。新しい商品を追加できます。";
  return;
 }

 products.forEach(p=>{
  const div=document.createElement("div");
  div.className="item";

  const thumb=p.image
   ?`<img class="item-thumb" src="${esc(p.image)}" alt="">`
   :"";

  div.innerHTML=thumb+
   '<div class="item-name">'+esc(p.name)+
   '<br><span class="category-tag">'+esc(getCategoryText(p))+'</span></div>'+
   '<button class="edit">編集</button>'+
   '<button class="delete">削除</button>';

  div.querySelector(".edit").addEventListener("click",()=>startEdit(p));
  div.querySelector(".delete").addEventListener("click",()=>removeProduct(p));

  list.appendChild(div);
 });
}

// ===================================
// 商品編集
// ===================================

function startEdit(p){
 editingProductId=p._docId;
 editingOldImageUrl=p.image||"";

 $("name").value=p.name||"";
 $("description").value=p.description||"";
 $("url").value=p.url||p.link||"";

 // 新カテゴリーがある商品はそのまま復元
 // 旧カテゴリーだけの商品は大カテゴリーだけ変換
 let main=p.mainCategory||legacyCategoryMap[p.category]||p.category||"";
 let sub=p.subCategory||"";
 let detail=p.detailCategory||"";

 if(!categoryData[main]){
  main="";
  sub="";
  detail="";
 }

 mainSelect.value=main;
 updateSubCategories(sub);

 if(!sub||!categoryData[main]?.[sub]){
  subSelect.value="";
  detail="";
  updateDetailCategories();
 }else{
  updateDetailCategories(detail);
 }

 if(!detail||!categoryData[main][sub].includes(detail)){
  detailSelect.value="";
 }

 imageUrl=p.image||"";
 imageFile.value="";

 if(imageUrl){
  preview.src=imageUrl;
  preview.style.display="block";
  imageStatus.textContent="現在の画像を使用します。変更する場合は写真を選択してください。";
 }else{
  preview.style.display="none";
  imageStatus.textContent="画像は登録されていません。";
 }

 $("formTitle").textContent="商品を編集";
 addButton.textContent="変更を保存する";
 cancelEdit.classList.remove("hidden");

 window.scrollTo({top:0,behavior:"smooth"});
}

// ===================================
// 入力フォーム初期化
// ===================================

function resetForm(){
 $("form").reset();

 editingProductId=null;
 editingOldImageUrl="";
 imageUrl="";
 imageFile.value="";
 preview.src="";
 preview.style.display="none";

 mainSelect.value="";
 updateSubCategories();

 imageStatus.textContent="写真を選ぶとCloudinaryにアップロードします。画像なしでも登録できます。";

 $("formTitle").textContent="商品を追加";
 addButton.textContent="商品を追加する";
 cancelEdit.classList.add("hidden");
}

cancelEdit.addEventListener("click",resetForm);

// ===================================
// 商品削除
// ===================================

async function removeProduct(p){
 if(!currentUser||currentUser.email!==ADMIN_EMAIL){
  alert("管理者としてログインしてください。");
  return;
 }

 if(!confirm("「"+p.name+"」を削除しますか？"))return;

 try{
  await deleteDoc(doc(db,"products",p._docId));

  products=products.filter(item=>item._docId!==p._docId);
  draw();
  status.textContent="登録商品："+products.length+"件";

  if(p.image){
   try{
    await deleteCloudinaryImage(p.image);
    alert("商品とCloudinary画像を削除しました。");
   }catch(imageError){
    alert("商品データは削除しましたが、Cloudinary画像の削除に失敗しました。\n"+imageError.message);
   }
  }else{
   alert("商品を削除しました。");
  }

 }catch(error){
  alert("商品を削除できませんでした："+error.message);
 }
}

// ===================================
// 商品登録・編集
// ===================================

$("form").addEventListener("submit",async e=>{
 e.preventDefault();

 if(uploading){
  alert("画像のアップロードが終わるまでお待ちください。");
  return;
 }

 if(!currentUser||currentUser.email!==ADMIN_EMAIL||!currentUser.emailVerified){
  alert("管理者としてログインしてください。");
  return;
 }

 const name=$("name").value.trim();
 const url=$("url").value.trim();
 const main=mainSelect.value;
 const sub=subSelect.value;
 const detail=detailSelect.value;

 if(!name){
  alert("商品名を入力してください。");
  return;
 }

 if(!main||!sub||!detail){
  alert("大・中・小カテゴリーをすべて選択してください。");
  return;
 }

 if(!/^https:\/\//i.test(url)){
  alert("商品リンクはhttps://から入力してください。");
  return;
 }

 const isEditing=!!editingProductId;
 const oldImage=editingOldImageUrl;

 addButton.disabled=true;
 addButton.textContent="保存中...";

 try{
  const data={
   name:name,

   // 新しい3段階カテゴリー
   mainCategory:main,
   subCategory:sub,
   detailCategory:detail,

   // 旧データとの互換性を維持
   category:main,

   description:$("description").value.trim(),
   image:imageUrl,
   url:url,
   link:url
  };

  if(isEditing){
   await updateDoc(doc(db,"products",editingProductId),data);

   if(oldImage&&oldImage!==imageUrl){
    try{
     await deleteCloudinaryImage(oldImage);
     alert("商品を更新し、古い画像も削除しました。");
    }catch(imageError){
     alert("商品は更新しましたが、古い画像の削除に失敗しました。\n"+imageError.message);
    }
   }else{
    alert("商品を更新しました。");
   }

  }else{
   data.id=Date.now();
   await addDoc(collection(db,"products"),data);
   alert("商品を保存しました。");
  }

  resetForm();
  await loadProducts();

 }catch(error){
  console.error(error);
