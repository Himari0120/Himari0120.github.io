
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おトク発見ナビ｜商品管理</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#f7f5ff;color:#333;font-family:Arial,"Noto Sans JP",sans-serif}
main{max-width:750px;margin:30px auto;background:white;padding:25px;border-radius:20px;box-shadow:0 5px 25px #0000000d}
h1{color:#705bc7;font-size:24px}
.note{font-size:13px;color:#888;line-height:1.7}
button{border:0;border-radius:22px;padding:12px 18px;background:#7963d8;color:white;font-weight:bold;cursor:pointer;margin:5px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;margin:7px 0 15px;font-size:14px}
label{font-size:13px;font-weight:bold}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid #eee;border-radius:12px;margin:10px 0}
.item-name{font-size:13px;flex:1;overflow-wrap:anywhere}
.delete{background:#fff0f0;color:#c44}
.secondary{background:#eee;color:#555}
.hidden{display:none}
hr{border:0;border-top:1px solid #eee;margin:25px 0}
</style>
</head>
<body>
<main>
<h1>おトク発見ナビ 商品管理</h1>
<p class="note">管理者専用ページです。Googleアカウントでログインしてください。</p>

<section id="loginArea">
<button id="login">Googleアカウントでログイン</button>
<p id="message" class="note"></p>
</section>

<section id="adminArea" class="hidden">
<p class="note">ログイン中：<span id="userEmail"></span></p>
<button id="logout" class="secondary">ログアウト</button>

<hr>
<h2>商品を追加</h2>
<form id="form">
<label>商品名 *</label>
<input id="name" required>

<label>カテゴリー *</label>
<select id="category">
<option>AI・便利ツール</option>
<option>パソコン・家電</option>
<option>美容・ファッション</option>
<option>生活・便利グッズ</option>
<option>旅行・ホテル</option>
</select>

<label>商品説明</label>
<textarea id="description"></textarea>

<label>商品リンク *</label>
<input id="url" type="url" required placeholder="https://...">

<label>商品画像URL</label>
<input id="image" type="url" placeholder="https://...">

<button type="submit">商品を追加する</button>
</form>

<hr>
<h2>登録済み商品</h2>
<div id="list">読み込み中...</div>
</section>
</main>

<script src="products.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
import {
  getFirestore, collection, getDocs, addDoc,
  deleteDoc, doc, setDoc
} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCpsSCuwwawuikXGFpIWjRTPL49_FDamrc",
  authDomain: "otoku-hakken-navi.firebaseapp.com",
  projectId: "otoku-hakken-navi",
  storageBucket: "otoku-hakken-navi.firebasestorage.app",
  messagingSenderId: "440089037998",
  appId: "1:440089037998:web:92b0c6d56f948bd629713f",
  measurementId: "G-L4WMMVCQ5Q"
};

const ADMIN_EMAIL = "keita19711020@gmail.com";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const loginArea = document.getElementById("loginArea");
const adminArea = document.getElementById("adminArea");
const message = document.getElementById("message");
const list = document.getElementById("list");

let products = [];

document.getElementById("login").addEventListener("click", async () => {
  message.textContent = "ログインしています...";
  try {
    await signInWithPopup(auth, provider);
  } catch (error) {
    message.textContent = "ログインできませんでした：" + error.message;
  }
});

document.getElementById("logout").addEventListener("click", async () => {
  await signOut(auth);
});

onAuthStateChanged(auth, async user => {
  loginArea.classList.remove("hidden");
  adminArea.classList.add("hidden");

  if (!user) {
    message.textContent = "管理者アカウントでログインしてください。";
    return;
  }

  if (user.email !== ADMIN_EMAIL || !user.emailVerified) {
    message.textContent = "このアカウントには管理権限がありません。";
    await signOut(auth);
    return;
  }

  message.textContent = "";
  loginArea.classList.add("hidden");
  adminArea.classList.remove("hidden");
  document.getElementById("userEmail").textContent = user.email;

  await loadProducts();
});

async function loadProducts() {
  list.textContent = "商品を読み込み中...";

  try {
    let snapshot = await getDocs(collection(db, "products"));

    // 初回だけ、既存のproducts.jsの商品をFirestoreへ移す
    if (snapshot.empty && window.PRODUCTS && window.PRODUCTS.length) {
      for (const p of window.PRODUCTS) {
        const id = String(p.id ?? Date.now() + Math.random());
        await setDoc(doc(db, "products", id), {
          ...p,
          link: p.link || p.url || ""
        });
      }
      snapshot = await getDocs(collection(db, "products"));
    }

    products = snapshot.docs.map(d => ({
      ...d.data(),
      _docId: d.id
    }));

    draw();
  } catch (error) {
    list.textContent = "読み込みエラー：" + error.message;
  }
}

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function draw() {
  list.innerHTML = "";

  if (!products.length) {
    list.textContent = "商品はありません。";
    return;
  }

  products.forEach(p => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML =
      '<div class="item-name">' + esc(p.name) +
      '<br><span style="color:#999">' + esc(p.category) +
      '</span></div><button class="delete">削除</button>';

    div.querySelector("button").addEventListener("click", async () => {
      if (!confirm("「" + p.name + "」を削除しますか？")) return;

      try {
        await deleteDoc(doc(db, "products", p._docId));
        await loadProducts();
        alert("商品を削除しました。");
      } catch (error) {
        alert("削除できませんでした：" + error.message);
      }
    });

    list.appendChild(div);
  });
}

document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();

  const url = document.getElementById("url").value.trim();
  const image = document.getElementById("image").value.trim();

  if (!/^https:\/\//i.test(url)) {
    alert("商品リンクはhttps://から入力してください。");
    return;
  }

  if (image && !/^https:\/\//i.test(image)) {
    alert("画像URLはhttps://から入力してください。");
    return;
  }

  try {
    await addDoc(collection(db, "products"), {
      id: Date.now(),
      name: document.getElementById("name").value.trim(),
      category: document.getElementById("category").value,
      description: document.getElementById("description").value.trim(),
      image,
      url,
      link: url
    });

    e.target.reset();
    await loadProducts();
    alert("商品を保存しました。");
  } catch (error) {
    alert("保存できませんでした：" + error.message);
  }
});
</script>
</body>
</html>
