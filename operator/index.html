
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#172235">
  <title>おトク発見ナビ｜運営者コンソール</title>
  <link rel="stylesheet" href="./css/operator.css">
</head>
<body>

  <header class="operator-header">
    <div class="header-brand">
      <div class="brand-name">おトク発見ナビ</div>
      <div class="brand-subtitle">運営者コンソール</div>
    </div>
    <div class="header-status">
      <span id="connectionStatus" class="status-badge">未接続</span>
    </div>
  </header>

  <div class="operator-layout">

    <aside class="operator-sidebar">
      <div class="sidebar-label">DEVELOPER CONTROL</div>
      <nav id="operatorNavigation">
        <button class="menu-button active" data-page="dashboard">ダッシュボード</button>
        <button class="menu-button" data-page="program">プログラム管理</button>
        <button class="menu-button" data-page="zip">ZIP生成管理</button>
        <button class="menu-button" data-page="version">バージョン・更新管理</button>
        <button class="menu-button" data-page="testing">テスト管理</button>
        <button class="menu-button" data-page="release">リリース管理</button>
        <button class="menu-button" data-page="security">セキュリティ管理</button>
        <button class="menu-button" data-page="sales">販売ページ監視</button>
        <button class="menu-button" data-page="settings">運営者設定</button>
      </nav>
      <div class="sidebar-footer">
        <p>運営者専用環境</p>
        <p>購入者管理機能はありません。</p>
      </div>
    </aside>

    <main class="operator-main">

      <section id="loginSection" class="login-section">
        <div class="login-card">
          <div class="login-icon">◆</div>
          <h1>運営者ログイン</h1>
          <p class="login-description">
            おトク発見ナビの運営者専用管理画面です。
          </p>
          <div class="security-message">
            <strong>認証システム未接続</strong>
            <p>安全な認証サーバーが接続されるまで管理機能は利用できません。</p>
          </div>
          <button id="loginButton" class="login-button" type="button" disabled>
            認証システム接続待ち
          </button>
        </div>
      </section>

      <section id="dashboardSection" hidden>
        <div class="page-header">
          <div>
            <div class="page-label">OPERATOR CONTROL PANEL</div>
            <h1 id="pageTitle">ダッシュボード</h1>
          </div>
          <span id="pageStatus">未認証</span>
        </div>
        <div id="pageContent" class="page-content"></div>
      </section>

    </main>
  </div>

  <footer class="operator-footer">
    <span>おトク発見ナビ 運営者コンソール</span>
    <span>Developer Only</span>
  </footer>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
