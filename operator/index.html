
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>おトク発見ナビ｜運営者コンソール</title>
  <link rel="stylesheet" href="./css/operator.css">
</head>
<body>
  <header class="header">
    <h1>おトク発見ナビ</h1>
    <span>運営者専用コンソール</span>
  </header>

  <main class="container">
    <section class="login-panel" id="login-panel">
      <h2>運営者ログイン</h2>
      <form id="login-form">
        <p>
          <label for="login-email">メールアドレス</label><br>
          <input id="login-email" type="email" required autocomplete="username">
        </p>
        <p>
          <label for="login-password">パスワード</label><br>
          <input id="login-password" type="password" required autocomplete="current-password">
        </p>
        <button type="submit">ログイン</button>
        <p id="login-message" role="status"></p>
      </form>
    </section>

    <section class="dashboard" id="dashboard-panel" hidden>
      <div class="page-heading">
        <h2>管理メニュー</h2>
        <button id="logout-button" type="button">ログアウト</button>
      </div>

      <nav>
        <a href="#dashboard">ダッシュボード</a>
        <a href="#program">プログラム管理</a>
        <a href="#zip">ZIP管理</a>
        <a href="#version">バージョン管理</a>
        <a href="#testing">テスト管理</a>
        <a href="#release">リリース管理</a>
        <a href="#security">セキュリティ管理</a>
        <a href="#sales">販売ページ監視</a>
        <a href="#settings">運営者設定</a>
      </nav>

      <p class="notice">
        管理機能はサーバー接続後に有効化されます。
      </p>

      <div id="operator-content"></div>
    </section>
  </main>

  <footer>
    <p>運営者専用システム</p>
  </footer>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
