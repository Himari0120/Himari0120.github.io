
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="おトク発見ナビ。毎日に、ときめく商品や便利なサービスを見つけるセレクトショップです。">
<title>おトク発見ナビ</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f7f8fc;color:#333}
header{background:white;padding:16px;border-bottom:1px solid #eee}
.header-inner{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{text-align:center;flex:1}
header h1{margin:0;color:#6755c8;font-size:27px}
header p{margin:7px 0 0;color:#777;font-size:13px}
.admin-link{display:inline-block;white-space:nowrap;text-decoration:none;background:linear-gradient(100deg,#7963d8,#a18ae9);color:white;padding:10px 16px;border-radius:25px;font-size:13px;font-weight:bold;box-shadow:0 3px 10px #7963d833}
.admin-link:hover{opacity:.85}

.hero{padding:25px 18px 30px;text-align:center;background:linear-gradient(135deg,#eee9ff,#ffeaf3)}
.hero-image-wrap{max-width:1100px;margin:0 auto 22px;overflow:hidden;border-radius:20px;box-shadow:0 8px 25px #6755c822}
.hero-image{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.hero h2{font-size:23px;margin:0 0 10px}
.hero p{margin:0;font-size:14px;line-height:1.8}

main{max-width:1000px;margin:25px auto;padding:0 15px}
.search{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px;background:white}

.category-area{margin:15px 0 20px}
.category-heading{font-size:14px;font-weight:bold;color:#6655b9;margin:0 0 9px}
.categories{display:flex;gap:8px;overflow-x:auto;padding:3px 0 12px}
.categories button{white-space:nowrap;border:1px solid #e3def2;background:white;border-radius:22px;padding:10px 15px;color:#555;cursor:pointer;font-size:13px}
.categories button.active{background:#6755c8;color:white;border-color:#6755c8;box-shadow:0 3px 9px #6755c833}

.subcategory-area{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:5px}
.select-box{background:white;border:1px solid #eee7f8;border-radius:13px;padding:12px}
.select-box label{display:block;font-size:12px;color:#7963d8;font-weight:bold;margin-bottom:7px}
.select-box select{width:100%;padding:11px;border:1px solid #e5e0ef;border-radius:9px;background:#fff;color:#444;font-size:14px}

.info{display:flex;justify-content:space-between;align-items:center;margin:18px 0 12px;gap:10px}
.info h2{font-size:18px;margin:0}
.info select{padding:8px;border:1px solid #ddd;border-radius:8px;background:white}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.card{background:white;border:1px solid #eeeaf8;border-radius:20px;padding:15px;box-shadow:0 5px 18px #503c120c;overflow:hidden}
.product-image{height:180px;background:linear-gradient(145deg,#f4efff,#fff0f6);border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:65px;margin-bottom:15px;overflow:hidden}
.product-image img{width:100%;height:100%;object-fit:contain}
.card h3{font-size:15px;line-height:1.7;margin:10px 0;color:#333;min-height:52px}
.category{display:inline-block;font-size:11px;color:#7258bd;background:#f2edff;padding:5px 11px;border-radius:20px}
.description{font-size:13px;color:#888;line-height:1.7;min-height:44px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.description.expanded{display:block;overflow:visible;-webkit-line-clamp:unset}
.read-more{display:inline-block;margin-top:5px;padding:0;border:0;background:none;color:#7963d8;font-size:12px;font-weight:bold;cursor:pointer}
.card button,.buy{display:block;width:100%;border:0;border-radius:25px;padding:13px;margin-top:10px;background:linear-gradient(100deg,#7963d8,#a18ae9);color:white;font-size:14px;font-weight:bold;text-align:center;text-decoration:none;cursor:pointer}
.card .favorite{background:#fff0f5;color:#d65b85;border:1px solid #ffe0eb}
.empty{text-align:center;padding:35px;color:#888;grid-column:1/-1;background:white;border-radius:15px}

footer{text-align:center;padding:30px 15px;color:#777;font-size:12px;line-height:2}
.modal-bg{display:none;position:fixed;inset:0;background:#0008;z-index:10;padding:20px;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:white;border-radius:15px;padding:22px;width:100%;max-width:500px;max-height:90vh;overflow:auto}
.modal h2{font-size:19px}
.close{float:right;border:0;background:#eee;border-radius:50%;width:32px;height:32px;cursor:pointer}

@media(max-width:600px){
 header{padding:13px 10px}
 .header-inner{gap:7px}
 header h1{font-size:20px}
 header p{font-size:10px;line-height:1.5}
 .admin-link{font-size:11px;padding:9px 11px}
 .hero{padding:18px 12px 25px}
 .hero-image-wrap{border-radius:14px;margin-bottom:18px}
 .hero h2{font-size:20px}
 .subcategory-area{gap:8px}
 .select-box{padding:9px}
 .select-box select{font-size:12px;padding:10px 5px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
 .card{padding:10px;border-radius:15px}
 .product-image{height:140px}
 .card h3{font-size:13px;min-height:60px}
 .description{font-size:12px}
 .info h2{font-size:15px}
}
</style>
</head>

<body>

<header>
<div class="header-inner">
  <div class="brand">
    <h1>おトク発見ナビ</h1>
    <p>毎日に、ときめく発見を。暮らしを彩る、わたしのセレクトショップ。</p>
  </div>
  <a class="admin-link" href="admin.html">⚙ 管理ページ</a>
</div>
</header>

<section class="hero">
  <div class="hero-image-wrap">
    <img class="hero-image"
      src="https://raw.githubusercontent.com/Himari0120/Himari0120.github.io/main/IMG_5222.jpeg"
      alt="おトク発見ナビのメインビジュアル"
      fetchpriority="high">
  </div>
  <h2>あなたのお気に入りを見つけよう！</h2>
  <p>毎日の暮らしをちょっと楽しくする商品をセレクトしました。</p>
</section>

<main>
<input id="searchInput" class="search" type="search" placeholder="商品名やキーワードで検索">

<div class="category-area">
  <p class="category-heading">カテゴリーから探す</p>
  <div id="categories" class="categories"></div>

  <div class="subcategory-area">
    <div class="select-box">
      <label for="subCategorySelect">中カテゴリー</label>
      <select id="subCategorySelect">
        <option value="">すべて</option>
      </select>
    </div>
    <div class="select-box">
      <label for="detailCategorySelect">小カテゴリー</label>
      <select id="detailCategorySelect">
        <option value="">すべて</option>
      </select>
    </div>
  </div>
</div>

<div class="info">
  <h2 id="resultTitle">おすすめ商品</h2>
  <select id="sortSelect">
    <option value="default">おすすめ順</option>
    <option value="name">名前順</option>
  </select>
</div>

<div id="productGrid" class="grid">
  <div class="empty">商品を読み込んでいます...</div>
</div>
</main>

<div id="modalBg" class="modal-bg">
  <div class="modal">
    <button class="close" id="closeModal">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<footer>
  <p>おトク発見ナビ</p>
  <p>Amazonのアソシエイトとして、適格販売により収入を得ています。</p>
  <p>商品情報は各販売サイトでご確認ください。</p>
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCpsSCuwwawuikXGFpIWjRTPL49_FDamrc",
  authDomain: "otoku-hakken-navi.firebaseapp.com",
  projectId: "otoku-hakken-navi",
  storageBucket: "otoku-hakken-navi.firebasestorage.app",
  messagingSenderId: "440089037998",
  appId: "1:440089037998:web:92b0c6d56f948bd629713f",
  measurementId: "G-L4WMMVCQ5Q"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let products = [];
let selectedMain = "すべて";
let selectedSub = "";
let selectedDetail = "";
const favorites = [];

const categoryData = {
  "💻 デジタル・AI": {
    "AIツール": ["画像生成","文章作成","動画生成","AIサービス"],
    "パソコン": ["ノートPC","デスクトップ","タブレット"],
    "周辺機器": ["マウス","キーボード","モニター"],
    "ソフトウェア": ["セキュリティ","編集ソフト","便利アプリ"]
  },
  "📱 スマホ・通信": {
    "スマートフォン": ["iPhone","Android"],
    "スマホ用品": ["ケース","充電器","イヤホン"],
    "通信サービス": ["格安SIM","Wi-Fi","光回線"]
  },
  "💄 美容・ファッション": {
    "レディースファッション": ["トップス・カットソー","ワンピース・スカート","パンツ・ボトムス","アウター・コート","バッグ・財布","靴・シューズ","アクセサリー","下着・ルームウェア"],
    "メンズファッション": ["トップス・シャツ","パンツ・ボトムス","アウター・ジャケット","スーツ・ビジネスウェア","バッグ・財布","靴・シューズ","アクセサリー","下着・ルームウェア"],
    "美容・コスメ": ["スキンケア","メイク用品","香水","美容家電","ヘアケア","メンズ美容"]
  },
  "🏠 暮らし・生活雑貨": {
    "生活雑貨": ["便利グッズ","日用品"],
    "インテリア": ["家具","照明","収納"],
    "キッチン": ["調理器具","キッチン家電","食器"],
    "掃除・洗濯": ["掃除用品","洗濯用品"]
  },
  "🍰 食品・グルメ": {
    "食品": ["お米","肉","魚","野菜"],
    "スイーツ": ["お菓子","ケーキ","和菓子"],
    "飲料": ["コーヒー","お茶","お酒"],
    "お取り寄せ": ["ご当地グルメ","ギフト"]
  },
  "✈️ 旅行・レジャー": {
    "ホテル・宿泊": ["ホテル","旅館","温泉"],
    "旅行用品": ["スーツケース","旅行バッグ"],
    "レジャー": ["観光","テーマパーク"],
    "アウトドア": ["キャンプ","登山"]
  },
  "💪 健康・スポーツ": {
    "健康用品": ["健康グッズ","測定器"],
    "サプリメント": ["栄養補助食品"],
    "フィットネス": ["トレーニング用品"],
    "スポーツ": ["スポーツウェア","スポーツシューズ"]
  },
  "🐶 ペット": {
    "犬用品": ["フード","おもちゃ","ケア用品"],
    "猫用品": ["フード","トイレ用品"],
    "その他のペット": ["飼育用品","ケア用品"]
  },
  "🎮 趣味・エンタメ": {
    "ゲーム": ["ゲーム機","ゲームソフト","周辺機器"],
    "ホビー": ["フィギュア","カード","模型"],
    "書籍": ["本","電子書籍"],
    "音楽・映像": ["イヤホン","スピーカー","映像作品"]
  },
  "👶 キッズ・ベビー": {
    "ベビー用品": ["育児用品","おむつ"],
    "子ども用品": ["おもちゃ","学用品"],
    "マタニティ": ["マタニティ用品"]
  }
};

const legacyCategoryMap = {
  "AI・便利ツール": "💻 デジタル・AI",
  "パソコン・家電": "💻 デジタル・AI",
  "美容・ファッション": "💄 美容・ファッション",
  "生活・便利グッズ": "🏠 暮らし・生活雑貨",
  "旅行・ホテル": "✈️ 旅行・レジャー"
};

const categories = document.getElementById("categories");
const grid = document.getElementById("productGrid");
const searchInput = document.getElementById("searchInput");
const subSelect = document.getElementById("subCategorySelect");
const detailSelect = document.getElementById("detailCategorySelect");

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

// 旧データも新カテゴリー形式に変換して扱う
function getProductCategory(product) {
  let main = product.mainCategory || "";
  let sub = product.subCategory || "";
  let detail = product.detailCategory || "";

  if (!main && product.category) {
    main = legacyCategoryMap[product.category] || product.category;
  }

  return { main, sub, detail };
}

function makeCategories() {
  categories.innerHTML = "";

  const allButton = document.createElement("button");
  allButton.textContent = "すべて";
  allButton.className = selectedMain === "すべて" ? "active" : "";
  allButton.addEventListener("click", () => {
    selectedMain = "すべて";
    selectedSub = "";
    selectedDetail = "";
    updateCategoryUI();
  });
  categories.appendChild(allButton);

  Object.keys(categoryData).forEach(main => {
    const button = document.createElement("button");
    button.textContent = main;
    button.className = selectedMain === main ? "active" : "";
    button.addEventListener("click", () => {
      selectedMain = main;
      selectedSub = "";
      selectedDetail = "";
      updateCategoryUI();
    });
    categories.appendChild(button);
  });
}

function updateSubCategories() {
  subSelect.innerHTML = '<option value="">すべて</option>';

  if (selectedMain !== "すべて" && categoryData[selectedMain]) {
    Object.keys(categoryData[selectedMain]).forEach(sub => {
      const option = document.createElement("option");
      option.value = sub;
      option.textContent = sub;
      subSelect.appendChild(option);
    });
  }

  subSelect.value = selectedSub;
  updateDetailCategories();
}

function updateDetailCategories() {
  detailSelect.innerHTML = '<option value="">すべて</option>';

  if (selectedMain !== "すべて" && selectedSub &&
      categoryData[selectedMain] &&
      categoryData[selectedMain][selectedSub]) {
    categoryData[selectedMain][selectedSub].forEach(detail => {
      const option = document.createElement("option");
      option.value = detail;
      option.textContent = detail;
      detailSelect.appendChild(option);
    });
  }

  detailSelect.value = selectedDetail;
}

function updateCategoryUI() {
  makeCategories();
  updateSubCategories();
  render();
}

subSelect.addEventListener("change", () => {
  selectedSub = subSelect.value;
  selectedDetail = "";
  updateDetailCategories();
  render();
});

detailSelect.addEventListener("change", () => {
  selectedDetail = detailSelect.value;
  render();
});

function render() {
  const keyword = searchInput.value.trim().toLowerCase();

  let list = products.filter(product => {
    const cat = getProductCategory(product);

    const mainMatch =
      selectedMain === "すべて" || cat.main === selectedMain;

    const subMatch =
      !selectedSub || cat.sub === selectedSub;

    const detailMatch =
      !selectedDetail || cat.detail === selectedDetail;

    const keywordMatch =
      (product.name || "").toLowerCase().includes(keyword) ||
      (product.description || "").toLowerCase().includes(keyword) ||
      (product.category || "").toLowerCase().includes(keyword) ||
      cat.main.toLowerCase().includes(keyword) ||
      cat.sub.toLowerCase().includes(keyword) ||
      cat.detail.toLowerCase().includes(keyword);

    return mainMatch && subMatch && detailMatch && keywordMatch;
  });

  if (document.getElementById("sortSelect").value === "name") {
    list.sort((a,b) => (a.name || "").localeCompare(b.name || "", "ja"));
  }

  document.getElementById("resultTitle").textContent =
    "おすすめ商品（" + list.length + "件）";

  grid.innerHTML = "";

  if (list.length === 0) {
    grid.innerHTML = '<div class="empty">該当する商品はありません。別のカテゴリーも見てみてください。</div>';
    return;
  }

  list.forEach(product => {
    const cat = getProductCategory(product);
    const card = document.createElement("article");
    card.className = "card";

    const imageHTML = product.image
      ? `<img src="${escapeHTML(product.image)}" alt="${escapeHTML(product.name)}" loading="lazy">`
      : escapeHTML(product.icon || "🛍️");

    const categoryText = [cat.sub, cat.detail].filter(Boolean).join(" / ") ||
      cat.main || product.category || "その他";

    card.innerHTML = `
      <div class="product-image">${imageHTML}</div>
      <div class="category">${escapeHTML(categoryText)}</div>
      <h3>${escapeHTML(product.name)}</h3>
      <p class="description">${escapeHTML(product.description || "")}</p>
      <button class="read-more" type="button">続きを読む</button>
      <button class="detail" type="button">詳細を見る</button>
      <button class="favorite" type="button">♡ お気に入り</button>
    `;

    const description = card.querySelector(".description");
    const readMore = card.querySelector(".read-more");

    requestAnimationFrame(() => {
      if (description.scrollHeight <= description.clientHeight + 1) {
        readMore.style.display = "none";
      }
    });

    readMore.addEventListener("click", () => {
      const expanded = description.classList.toggle("expanded");
      readMore.textContent = expanded ? "閉じる" : "続きを読む";
    });

    card.querySelector(".detail").addEventListener("click", () => {
      showDetail(product);
    });

    const favoriteButton = card.querySelector(".favorite");

    if (favorites.includes(product.id)) {
      favoriteButton.textContent = "♥ お気に入り登録済み";
    }

    favoriteButton.addEventListener("click", () => {
      const index = favorites.indexOf(product.id);

      if (index === -1) {
        favorites.push(product.id);
        favoriteButton.textContent = "♥ お気に入り登録済み";
      } else {
        favorites.splice(index, 1);
        favoriteButton.textContent = "♡ お気に入り";
      }
    });

    grid.appendChild(card);
  });
}

function showDetail(product) {
  const cat = getProductCategory(product);
  const imageHTML = product.image
    ? `<img src="${escapeHTML(product.image)}" alt="" style="width:100%;max-height:220px;object-fit:contain">`
    : "";

  const categoryText = [
    cat.main,cat.sub,cat.detail
  ].filter(Boolean).join(" ＞ ") || product.category || "その他";

  document.getElementById("modalContent").innerHTML = `
    ${imageHTML}
    <h2>${escapeHTML(product.name)}</h2>
    <p>${escapeHTML(product.description || "")}</p>
    <p>カテゴリー：${escapeHTML(categoryText)}</p>
    <a class="buy"
       href="${escapeHTML(product.link || product.url || "#")}"
       target="_blank"
       rel="noopener noreferrer">
       販売サイトで商品を見る
    </a>
  `;

  document.getElementById("modalBg").classList.add("show");
}

async function loadProducts() {
  try {
    const snapshot = await getDocs(collection(db, "products"));

    products = snapshot.docs.map(d => {
      const p = d.data();
      return {
        ...p,
        id: d.id,
        link: p.link || p.url || ""
      };
    });

  } catch (error) {
    console.error("商品読み込みエラー:", error);
    products = [];
    grid.innerHTML = '<div class="empty">商品を読み込めませんでした。時間をおいて再度お試しください。</div>';
    return;
  }

  updateCategoryUI();
}

searchInput.addEventListener("input", render);
document.getElementById("sortSelect").addEventListener("change", render);

document.getElementById("closeModal").addEventListener("click", () => {
  document.getElementById("modalBg").classList.remove("show");
});

document.getElementById("modalBg").addEventListener("click", event => {
  if (event.target.id === "modalBg") {
    event.currentTarget.classList.remove("show");
  }
});

loadProducts();
</script>
</body>
</html>
